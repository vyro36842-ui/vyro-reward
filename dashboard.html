<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyro Reward - Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 30%, #121829 0%, #060812 100%);
            --primary-gold: #FFD700;
            --secondary-gold: #FFA500;
            --accent-purple: #8A2BE2;
            --neon-blue: #00F3FF;
            --neon-red: #FF3366;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --nav-bg: rgba(12, 16, 32, 0.85);
            --card-bg: rgba(18, 22, 41, 0.75);
            --border-glow: rgba(255, 215, 0, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: var(--bg-gradient);
            background-color: #060812;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }

        /* Canvas Particle Background (Girta hua/Ghumta hua effect) */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Glow Orbs for Luxury Look */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 1;
            pointer-events: none;
            opacity: 0.5;
            animation: pulseGlow 8s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, var(--accent-purple), transparent);
            top: -10%;
            left: -10%;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.25), transparent);
            bottom: -10%;
            right: -10%;
            animation-delay: -4s;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
            100% { transform: scale(1.3) translate(30px, -30px); opacity: 0.7; }
        }

        /* Main View Container */
        .app-view {
            position: relative;
            z-index: 10;
            flex: 1;
            width: 100%;
            max-width: 480px;
