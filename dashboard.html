<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyro Reward - Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #060812;
            --primary-gold: #FFD700;
            --text-muted: #94A3B8;
            --nav-bg: rgba(12, 16, 32, 0.92);
            --neon-red: #FF3366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .app-view {
            position: relative;
            z-index: 10;
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tab-section {
            display: none;
            width: 100%;
            height: 100%;
        }

        .tab-section.active {
            display: block;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 72px;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 215, 0, 0.18);
            z-index: 100;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 8px;
            box-shadow: 0 -10px 28px rgba(0, 0, 0, 0.7);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            width: 25%;
            height: 100%;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-item i {
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .nav-item.active {
            color: var(--primary-gold);
        }

        .nav-item.active i {
            transform: translateY(-3px) scale(1.18);
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.7));
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 6px;
            width: 16px;
            height: 3px;
            background: var(--primary-gold);
            border-radius: 10px;
            box-shadow: 0 0 8px var(--primary-gold);
        }

        /* Offline Overlay */
        .offline-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(6, 8, 18, 0.96);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .offline-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .offline-card {
            width: 100%;
            max-width: 380px;
            background: rgba(22, 16, 28, 0.9);
            border: 1px solid rgba(255, 51, 102, 0.3);
            border-radius: 28px;
            padding: 36px 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <main class="app-view">
        <div id="sectionHome" class="tab-section active"></div>
        <div id="sectionReferral" class="tab-section"></div>
        <div id="sectionWallet" class="tab-section"></div>
        <div id="sectionSetting" class="tab-section"></div>
    </main>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('Home', this)">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </button>
        <button class="nav-item" onclick="switchTab('Referral', this)">
            <i class="fa-solid fa-user-plus"></i>
            <span>Referral</span>
        </button>
        <button class="nav-item" onclick="switchTab('Wallet', this)">
            <i class="fa-solid fa-wallet"></i>
            <span>Wallet</span>
        </button>
        <button class="nav-item" onclick="switchTab('Setting', this)">
            <i class="fa-solid fa-gear"></i>
            <span>Setting</span>
        </button>
    </nav>

    <div id="offlineOverlay" class="offline-overlay">
        <div class="offline-card">
            <div style="width: 75px; height: 75px; border-radius: 50%; background: rgba(255, 51, 102, 0.12); color: var(--neon-red); font-size: 32px; display: flex; justify-content: center; align-items: center; margin-bottom: 20px;">
                <i class="fa-solid fa-wifi"></i>
            </div>
            <h3 style="color: #FFF; margin-bottom: 10px;">Connection Lost</h3>
            <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 25px;">Please check your internet connection.</p>
            <button onclick="location.reload()" style="width: 100%; padding: 15px; border-radius: 16px; border: none; background: var(--neon-red); color: #FFF; font-weight: 700; cursor: pointer;">Retry</button>
        </div>
    </div>

    <script>
        function switchTab(tabName, element) {
            var sections = document.querySelectorAll('.tab-section');
            sections.forEach(function(sec) { sec.classList.remove('active'); });

            var navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(function(item) { item.classList.remove('active'); });

            var targetSection = document.getElementById('section' + tabName);
            if (targetSection) {
                targetSection.classList.add('active');
            }
            element.classList.add('active');
        }

        var offlineOverlay = document.getElementById('offlineOverlay');
        if (!navigator.onLine) {
            offlineOverlay.classList.add('active');
        }

        window.addEventListener('online', function() {
            offlineOverlay.classList.remove('active');
        });
        window.addEventListener('offline', function() {
            offlineOverlay.classList.add('active');
        });
    </script>
</body>
</html>
