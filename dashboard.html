<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyro Reward - Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #060812;
            --primary-gold: #FFD700;
            --secondary-gold: #FFA500;
            --accent-purple: #8A2BE2;
            --neon-blue: #00F3FF;
            --neon-red: #FF3366;
            --text-muted: #94A3B8;
            --nav-bg: rgba(12, 16, 32, 0.92);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }

        /* Particle Background */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Main View Container */
        .app-view {
            position: relative;
            z-index: 10;
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tab-section {
            display: none;
            width: 100%;
            height: 100%;
        }

        .tab-section.active {
            display: block;
        }

        /* ================= BOTTOM NAVIGATION BAR ================= */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 72px;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 215, 0, 0.18);
            z-index: 100;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 8px;
            box-shadow: 0 -10px 28px rgba(0, 0, 0, 0.7);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            width: 25%;
            height: 100%;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-item i {
            font-size: 20px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .nav-item.active {
            color: var(--primary-gold);
        }

        .nav-item.active i {
            transform: translateY(-3px) scale(1.18);
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.7));
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 6px;
            width: 16px;
            height: 3px;
            background: var(--primary-gold);
            border-radius: 10px;
            box-shadow: 0 0 8px var(--primary-gold);
        }

        /* ================= OFFLINE OVERLAY ================= */
        .offline-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(6, 8, 18, 0.96);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .offline-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .offline-card {
            width: 100%;
            max-width: 380px;
            background: rgba(22, 16, 28, 0.9);
            border: 1px solid rgba(255, 51, 102, 0.3);
            border-radius: 28px;
            padding: 36px 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(255, 51, 102, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: bounceIn 0.5s ease;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .offline-icon-box {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: rgba(255, 51, 102, 0.12);
            border: 1px solid rgba(255, 51, 102, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            color: var(--neon-red);
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.3);
            animation: pulseRed 2s infinite ease-in-out;
        }

        @keyframes pulseRed {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 51, 102, 0.3); }
            50% { transform: scale(1.08); box-shadow: 0 0 30px rgba(255, 51, 102, 0.6); }
        }

        .offline-title {
            font-size: 22px;
            font-weight: 800;
            color: #FFF;
            margin-bottom: 10px;
        }

        .offline-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn-retry {
            width: 100%;
            padding: 15px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, var(--neon-red), #D91B5C);
            color: #FFF;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 51, 102, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .btn-retry:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <!-- Canvas Particles -->
    <canvas id="particleCanvas"></canvas>

    <!-- Main View Area -->
    <main class="app-view">
        <div id="sectionHome" class="tab-section active"></div>
        <div id="sectionReferral" class="tab-section"></div>
        <div id="sectionWallet" class="tab-section"></div>
        <div id="sectionSetting" class="tab-section"></div>
    </main>

    <!-- 4-Tab Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('Home', this)">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </button>

        <button class="nav-item" onclick="switchTab('Referral', this)">
            <i class="fa-solid fa-user-plus"></i>
            <span>Referral</span>
        </button>

        <button class="nav-item" onclick="switchTab('Wallet', this)">
            <i class="fa-solid fa-wallet"></i>
            <span>Wallet</span>
        </button>

        <button class="nav-item" onclick="switchTab('Setting', this)">
            <i class="fa-solid fa-gear"></i>
            <span>Setting</span>
        </button>
    </nav>

    <!-- OFFLINE OVERLAY -->
    <div id="offlineOverlay" class="offline-overlay">
        <div class="offline-card">
            <div class="offline-icon-box">
                <i class="fa-solid fa-wifi"></i>
            </div>
            <h3 class="offline-title">Connection Lost</h3>
            <p class="offline-desc">Internet connection is required to access Vyro Reward. Please check your data or Wi-Fi network.</p>
            <button class="btn-retry" onclick="checkNetworkAndRetry()">
                <i class="fa-solid fa-rotate-right"></i>
                <span>Retry Connection</span>
            </button>
        </div>
    </div>

    <script>
        function switchTab(tabName, element) {
            const sections = document.querySelectorAll('.tab-section');
            sections.forEach(sec => sec.classList.remove('active'));

            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => item.classList.remove('active'));

            const targetSection = document.getElementById('section' + tabName);
            if (targetSection) {
                targetSection.classList.add('active');
            }
            element.classList.add('active');
        }

        // Offline Network Monitoring
        const offlineOverlay = document.getElementById('offlineOverlay');

        function showOfflineOverlay() {
            if (offlineOverlay) offlineOverlay.classList.add('active');
        }

        function hideOfflineOverlay() {
            if (offlineOverlay) offlineOverlay.classList.remove('active');
        }

        function checkNetworkAndRetry() {
            if (navigator.onLine) {
                hideOfflineOverlay();
            } else {
                const retryBtn = document.querySelector('.btn-retry span');
                if (retryBtn) {
                    retryBtn.innerText = "Still Offline...";
                    setTimeout(() => { retryBtn.innerText = "Retry Connection"; }, 1500);
                }
            }
        }

        window.addEventListener('online', hideOfflineOverlay);
        window.addEventListener('offline', showOfflineOverlay);

        function initParticles() {
            const canvas = document.getElementById('particleCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            const particles = Array.from({ length: 30 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speedX: (Math.random() - 0.5) * 0.3,
                speedY: (Math.random() - 0.5) * 0.3,
                color: Math.random() > 0.5 ? '#FFD700' : '#8A2BE2'
            }));

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.x += p.speedX;
                    p.y += p.speedY;
                    if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;

                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                requestAnimationFrame(animate);
            }
            animate();
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (!navigator.onLine) {
                showOfflineOverlay();
            }
            initParticles();
        });
    </script>
</body>
</html>
