<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyro Reward - Core Version</title>
    <!-- Firebase core Standard SDK Libraries -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-card { background: white; padding: 35px 25px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; width: 100%; max-width: 380px; }
        .logo-area { font-size: 44px; margin-bottom: 5px; }
        h2 { color: #333; margin-bottom: 5px; font-size: 24px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group input { width: 100%; padding: 12px; border: 2px solid #e1e1e1; border-radius: 12px; font-size: 15px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #667eea; }
        .action-btn { background: #667eea; color: white; border: none; padding: 12px; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; box-shadow: 0 4px 10px rgba(102,126,234,0.3); }
        .toggle-text { margin-top: 15px; font-size: 13px; color: #667eea; cursor: pointer; font-weight: 500; }
        .welcome-box { display: none; }
        .welcome-box.active { display: block; }
        .login-box { display: block; }
        .login-box.hidden { display: none; }
        .profile-img { width: 80px; height: 80px; border-radius: 50%; background: #e8f0fe; display: flex; align-items: center; justify-content: center; font-size: 36px; margin: 0 auto 15px auto; color: #667eea; border: 3px solid #667eea; }
        .logout-btn { background: #ff4d4d; color: white; border: none; padding: 12px; border-radius: 8px; margin-top: 20px; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- लॉगिन और साइनअप बॉक्स -->
        <div id="login-container" class="login-box">
            <div class="logo-area">💰</div>
            <h2 id="form-title">Vyro Reward</h2>
            <p id="form-subtitle">अपना अकाउंट बनाकर असली कमाई शुरू करें</p>
            
            <div class="input-group">
                <input type="email" id="email-input" placeholder="अपना ईमेल डालें">
            </div>
            <div class="input-group">
                <input type="password" id="password-input" placeholder="पासवर्ड (कम से कम 6 अक्षर)">
            </div>
            
            <button id="btn-action" class="action-btn">नया अकाउंट बनाएं (Sign Up)</button>
            <div id="toggle-form" class="toggle-text">पहले से अकाउंट है? लॉगिन करें</div>
        </div>

        <!-- डैशबोर्ड बॉक्स -->
        <div id="welcome-container" class="welcome-box">
            <div class="profile-img">👤</div>
            <h2>नमस्ते, Vyro Creator!</h2>
            <p id="user-display-email">user@gmail.com</p>
            
            <div style="background: #f0f2ff; border: 1px dashed #667eea; padding: 15px; border-radius: 12px; margin-top: 15px;">
                <span style="font-size: 14px; color: #555;">आपका असली बैलेंस</span>
                <h3 style="font-size: 28px; color: #764ba2; margin-top: 5px;"><span id="user-coins">Loading...</span> Coins</h3>
            </div>

            <button id="btn-logout" class="logout-btn">अकाउंट लॉगआउट करें</button>
        </div>
    </div>

    <script>
        // आपका असली Firebase कॉन्फिग कोड
        const firebaseConfig = {
          apiKey: "AIzaSyBWhmQlSv2Bz2hWspsE7M-I6lL1V4AeLy0",
          authDomain: "://firebaseapp.com",
          projectId: "vyro-75bbc",
          storageBucket: "vyro-75bbc.firebasestorage.app",
          messagingSenderId: "1077764939396",
          appId: "1:1077764939396:web:ab5bc74dd831c7b33becd1"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const db = firebase.firestore(); 

        const loginContainer = document.getElementById('login-container');
        const welcomeContainer = document.getElementById('welcome-container');
        const emailInput = document.getElementById('email-input');
        const passwordInput = document.getElementById('password-input');
        const btnAction = document.getElementById('btn-action');
        const toggleForm = document.getElementById('toggle-form');
        const btnLogout = document.getElementById('btn-logout');

        let isSignUpMode = true;

        // फॉर्म बदलने का लॉजिक (लॉगिन <-> साइनअप)
        toggleForm.addEventListener('click', () => {
            isSignUpMode = !isSignUpMode;
            if (isSignUpMode) {
                document.getElementById('form-title').innerText = "Vyro Reward";
                document.getElementById('form-subtitle').innerText = "अपना अकाउंट बनाकर असली कमाई शुरू करें";
                btnAction.innerText = "नया अकाउंट बनाएं (Sign Up)";
                toggleForm.innerText = "पहले से अकाउंट है? लॉगिन करें";
            } else {
                document.getElementById('form-title').innerText = "Welcome Back";
                document.getElementById('form-subtitle').innerText = "अपने अकाउंट में लॉगिन करें";
                btnAction.innerText = "लॉगिन करें (Log In)";
                toggleForm.innerText = "नया अकाउंट बनाना है? यहाँ क्लिक करें";
            }
        });

        // असली लॉगिन/साइनअप एक्शन
        btnAction.addEventListener('click', () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                alert("कृपया ईमेल और पासवर्ड दोनों भरें!");
                return;
            }

            if (isSignUpMode) {
                // नया खाता बनाना
                auth.createUserWithEmailAndPassword(email, password)
                .catch(err => alert("साइनअप एरर: " + err.message));
            } else {
                // पुराने खाते से लॉगिन
                auth.signInWithEmailAndPassword(email, password)
                .catch(err => alert("लॉगिन एरर: " + err.message));
            }
        });

        btnLogout.addEventListener('click', () => {
            auth.signOut().then(() => { window.location.reload(); });
        });

        // रीयल-टाइम डेटाबेस और कॉइन ट्रैकिंग
        auth.onAuthStateChanged(user => {
            if (user) {
                loginContainer.classList.add('hidden');
                welcomeContainer.classList.add('active');
                document.getElementById('user-display-email').innerText = user.email;

                const userRef = db.collection('users').doc(user.uid);
                userRef.onSnapshot(doc => {
                    if (doc.exists) {
                        document.getElementById('user-coins').innerText = doc.data().coins;
                    } else {
                        // डेटाबेस में रीयल खाता बनाना और 100 वेलकम कॉइन देना
                        userRef.set({
                            uid: user.uid,
                            email: user.email,
                            coins: 100, 
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        }).then(() => {
                            document.getElementById('user-coins').innerText = "100";
                        }).catch((e) => {
                            document.getElementById('user-coins').innerText = "100 (Local)";
                        });
                    }
                });
            } else {
                loginContainer.classList.remove('hidden');
                welcomeContainer.classList.remove('active');
            }
        });
    </script>
</body>
</html>
