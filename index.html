    <style>
        :root {
            --bg-color: #060812;
            --primary-gold: #FFD700;
            --secondary-gold: #FFA500;
            --accent-purple: #8A2BE2;
            --neon-blue: #00F3FF;
            --card-bg: rgba(18, 22, 41, 0.75);
            --border-glow: rgba(255, 215, 0, 0.25);
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Canvas Particle Background */
        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Glow Orbs */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 1;
            pointer-events: none;
            opacity: 0.5;
            animation: pulseGlow 8s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, var(--accent-purple), transparent);
            top: -10%;
            left: -10%;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.3), transparent);
            bottom: -10%;
            right: -10%;
            animation-delay: -4s;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
            100% { transform: scale(1.3) translate(30px, -30px); opacity: 0.7; }
        }

        /* Container */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Stage Handling */
        .stage {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .stage-hidden {
            opacity: 0;
            transform: scale(0.92) translateY(20px);
            pointer-events: none;
            position: absolute;
        }

        .stage-active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: all;
            position: relative;
        }

        /* ================= STAGE 1: SPLASH ================= */
        .logo-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 35px;
            perspective: 1000px;
        }

        .ring-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--primary-gold);
            border-right-color: var(--neon-blue);
            animation: spinContinuous 3s linear infinite;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .ring-inner {
            position: absolute;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            border: 2px dashed rgba(138, 43, 226, 0.6);
            animation: spinReverse 6s linear infinite;
        }

        /* 360 Rotating 'V' Logo */
        .logo-3d-v {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 72px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFF 0%, var(--primary-gold) 50%, var(--secondary-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 18px rgba(255, 215, 0, 0.6));
            transform-style: preserve-3d;
            animation: rotateV3D 4s linear infinite;
        }

        @keyframes rotateV3D {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        @keyframes spinContinuous {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spinReverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        .brand-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #FFFFFF 0%, #CBD5E1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .brand-tagline {
            font-size: 13px;
            color: var(--primary-gold);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 45px;
        }

        .progress-box {
            width: 100%;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-purple), var(--primary-gold), var(--neon-blue));
            border-radius: 20px;
            box-shadow: 0 0 12px var(--primary-gold);
            transition: width 0.1s linear;
        }

        .progress-text-group {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .counter-num {
            color: var(--primary-gold);
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
        }

        /* ================= STAGE 2: LOGIN CARD ================= */
        .glass-card {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 28px;
            padding: 32px 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .card-icon {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            color: var(--primary-gold);
            margin-bottom: 20px;
        }

        .welcome-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #FFF;
        }

        .welcome-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 28px;
        }
