<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyro - Step 1 Real Login</title>
    <!-- Firebase Standard SDK Libraries -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-card { background: white; padding: 40px 30px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; width: 100%; max-width: 380px; }
        .logo-area { font-size: 48px; margin-bottom: 10px; }
        h2 { color: #333; margin-bottom: 8px; font-size: 24px; }
        p { color: #666; font-size: 14px; margin-bottom: 30px; }
        .google-btn { background: #fff; color: #444; border: 2px solid #e1e1e1; padding: 12px 16px; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .google-btn:hover { background: #f5f5f5; border-color: #ccc; }
        .google-icon { width: 20px; height: 20px; }
        .welcome-box { display: none; }
        .welcome-box.active { display: block; }
        .login-box { display: block; }
        .login-box.hidden { display: none; }
        .profile-img { width: 90px; height: 90px; border-radius: 50%; border: 4px solid #667eea; margin-bottom: 15px; }
        .logout-btn { background: #ff4d4d; color: white; border: none; padding: 12px; border-radius: 8px; margin-top: 20px; cursor: pointer; width: 100%; font-weight: bold; font-size: 15px; }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- लॉगिन बॉक्स (शुरुआत में दिखेगा) -->
        <div id="login-container" class="login-box">
            <div class="logo-area">💰</div>
            <h2>Vyro Reward</h2>
            <p>लॉगिन करें और असली रिवॉर्ड्स कमाना शुरू करें</p>
            <button id="btn-login" class="google-btn">
                <img class="google-icon" src="https://gstatic.com" alt="Google">
                Google अकाउंट से जुड़ें
            </button>
        </div>

        <!-- लॉगिन होने के बाद का डैशबोर्ड बॉक्स -->
        <div id="welcome-container" class="welcome-box">
            <img id="user-avatar" class="profile-img" src="" alt="User">
            <h2>नमस्ते, <span id="user-display-name">User</span>!</h2>
            <p id="user-display-email">user@gmail.com</p>
            
            <!-- कॉइन का स्ट्रक्चर (स्टेप 2 में इसे असली डेटाबेस से लिंक करेंगे) -->
            <div style="background: #f0f2ff; border: 1px dashed #667eea; padding: 15px; border-radius: 12px; margin-top: 15px;">
                <span style="font-size: 14px; color: #555;">आपका बैलेंस</span>
                <h3 style="font-size: 28px; color: #764ba2; margin-top: 5px;">0 Coins</h3>
            </div>

            <button id="btn-logout" class="logout-btn">अकाउंट लॉगआउट करें</button>
        </div>
    </div>

    <script>
        // आपका असली Firebase कॉन्फिग जो आपने जनरेट किया है
        const firebaseConfig = {
          apiKey: "AIzaSyBWhmQlSv2Bz2hWspsE7M-I6lL1V4AeLy0",
          authDomain: "://firebaseapp.com",
          projectId: "vyro-75bbc",
          storageBucket: "vyro-75bbc.firebasestorage.app",
          messagingSenderId: "1077764939396",
          appId: "1:1077764939396:web:ab5bc74dd831c7b33becd1"
        };

        // Firebase को इनिशियलाइज़ करना
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        // UI एलिमेंट्स को सेलेक्ट करना
        const loginContainer = document.getElementById('login-container');
        const welcomeContainer = document.getElementById('welcome-container');
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');

        // असली गूगल लॉगिन ट्रिगर
        btnLogin.addEventListener('click', () => {
            auth.signInWithPopup(provider).catch(err => {
                alert("लॉगिन में समस्या आई: " + err.message);
            });
        });

        // लॉगआउट ट्रिगर
        btnLogout.addEventListener('click', () => {
            auth.signOut();
        });

        // रियल-टाइम यूजर स्टेट मॉनिटर (Real Auth State)
        auth.onAuthStateChanged(user => {
            if (user) {
                // अगर यूजर सफलतापूर्वक लॉगिन हो जाता है
                loginContainer.classList.add('hidden');
                welcomeContainer.classList.add('active');
                document.getElementById('user-avatar').src = user.photoURL || 'https://placeholder.com';
                document.getElementById('user-display-name').innerText = user.displayName || 'User';
                document.getElementById('user-display-email').innerText = user.email;
            } else {
                // अगर यूजर लॉगआउट है या लॉगिन नहीं हुआ है
                loginContainer.classList.remove('hidden');
                welcomeContainer.classList.remove('active');
            }
        });
    </script>
</body>
</html>
