
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#240817">
<title>Vyro Reward</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --red: #ff3158;
  --pink: #ff72bd;
  --light: #ffe1ef;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(ellipse at 15% 15%, #83133f 0%, transparent 45%),
    radial-gradient(ellipse at 90% 85%, #71164d 0%, transparent 45%),
    linear-gradient(145deg, #180610, #350b25, #200817);
}

.screen {
  min-height: 100vh;
  min-height: 100dvh;
  width: 100%;
  padding: 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
}

.hidden {
  display: none !important;
}

.logo {
  width: 120px;
  height: 120px;
  border-radius: 35px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 57px;
  font-weight: 900;
  color: white;
  background: linear-gradient(145deg, #ff3158, #e52b91);
  border: 2px solid #ffb5d6;
  box-shadow: 0 0 45px #ff315844,
              inset 0 0 20px #ffffff22;
}

.brand {
  margin: 23px 0 8px;
  font-size: 29px;
  font-weight: 900;
  letter-spacing: 1px;
}

.brand span {
  color: var(--pink);
}

.subtitle {
  color: #f0bfd5;
  font-size: 14px;
  line-height: 1.7;
}

.progress {
  width: 100%;
  max-width: 310px;
  height: 9px;
  margin-top: 32px;
  background: #ffffff18;
  border-radius: 20px;
  overflow: hidden;
}

.bar {
  width: 0%;
  height: 100%;
  border-radius: 20px;
  background: linear-gradient(90deg, var(--red), var(--pink));
  box-shadow: 0 0 15px #ff72bd88;
}

.percent {
  margin-top: 12px;
  color: var(--pink);
  font-size: 14px;
}

.login-card {
  width: 100%;
  max-width: 380px;
  padding: 28px 23px;
  border-radius: 27px;
  border: 1px solid #ff72bd55;
  background: linear-gradient(145deg,
    #ffffff12, #ff31580b);
  backdrop-filter: blur(20px);
  box-shadow: 0 20px 60px #0003;
}

.login-card .logo {
  width: 82px;
  height: 82px;
  border-radius: 25px;
  font-size: 39px;
  margin: auto;
}

.login-card .brand {
  font-size: 24px;
  margin-top: 20px;
}

input {
  width: 100%;
  margin-top: 24px;
  padding: 16px;
  border: 1px solid #ff72bd66;
  border-radius: 14px;
  background: #210b19;
  color: white;
  text-align: center;
  font-size: 19px;
  outline: none;
}

input:focus {
  border-color: var(--pink);
  box-shadow: 0 0 15px #ff72bd22;
}

input::placeholder {
  color: #d5a4bd;
}

button {
  width: 100%;
  margin-top: 17px;
  padding: 16px;
  border: 0;
  border-radius: 14px;
  background: linear-gradient(100deg, var(--red), var(--pink));
  color: white;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 8px 25px #ff315822;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.message {
  min-height: 24px;
  margin-top: 15px;
  color: var(--light);
  font-size: 13px;
  line-height: 1.6;
}
</style>
</head>

<body>

<!-- LOADING SCREEN -->
<section class="screen" id="loadingScreen">
  <div class="logo">V</div>

  <div class="brand">
    VYRO <span>REWARD</span>
  </div>

  <p class="subtitle">Welcome to Vyro Reward</p>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>

  <div class="percent" id="percent">0%</div>
  <p class="subtitle" id="loadMessage">Loading your experience...</p>
</section>

<!-- LOGIN SCREEN -->
<section class="screen hidden" id="loginScreen">
  <div class="login-card">
    <div class="logo">V</div>

    <div class="brand">
      VYRO <span>REWARD</span>
    </div>

    <p class="subtitle">Welcome back! Enter your password.</p>

    <input
      id="password"
      type="password"
      inputmode="numeric"
      maxlength="6"
      placeholder="Enter Password"
      autocomplete="current-password"
    >

    <button id="loginButton" disabled onclick="login()">
      LOGIN →
    </button>

    <div class="message" id="message">
      इंटरनेट कनेक्शन जाँचा जा रहा है...
    </div>
  </div>
</section>

<script>
const loadingScreen = document.getElementById("loadingScreen");
const loginScreen = document.getElementById("loginScreen");
const bar = document.getElementById("bar");
const percent = document.getElementById("percent");
const loadMessage = document.getElementById("loadMessage");
const password = document.getElementById("password");
const loginButton = document.getElementById("loginButton");
const message = document.getElementById("message");

let internetOK = false;
let checking = false;
let pageReady = false;

function showLogin() {
  loadingScreen.classList.add("hidden");
  loginScreen.classList.remove("hidden");
}

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function checkInternet() {
  if (checking) return false;

  checking = true;
  internetOK = false;
  loginButton.disabled = true;

  if (!navigator.onLine) {
    message.textContent = "इंटरनेट चालू करो और दोबारा कोशिश करो।";
    checking = false;
    return false;
  }

  message.textContent = "इंटरनेट कनेक्शन जाँचा जा रहा है...";

  let timer;

  try {
    const controller = new AbortController();

    timer = setTimeout(() => controller.abort(), 6000);

    await fetch("https://www.google.com/generate_204", {
      mode: "no-cors",
      cache: "no-store",
      signal: controller.signal
    });

    internetOK = true;
    message.textContent = "कनेक्शन तैयार है।";
  } catch (error) {
    internetOK = false;
    message.textContent = "इंटरनेट नहीं चल रहा। दोबारा कोशिश करो।";
  } finally {
    clearTimeout(timer);
    checking = false;
    loginButton.disabled = !internetOK || !pageReady;
  }

  return internetOK;
}

async function startApp() {
  for (let i = 0; i <= 100; i++) {
    bar.style.width = i + "%";
    percent.textContent = i + "%";
    await wait(20);
  }

  loadMessage.textContent = "Checking connection...";
  showLogin();

  const connected = await checkInternet();

  if (connected) {
    pageReady = true;

    if (localStorage.getItem("vyroLoggedIn") === "yes") {
      window.location.replace("home.html");
      return;
    }

    loginButton.disabled = false;
  }
}

async function login() {
  if (!pageReady || checking) return;

  loginButton.disabled = true;

  const connected = await checkInternet();

  if (!connected) return;

  if (password.value !== "123456") {
    message.textContent = "गलत पासवर्ड! दोबारा कोशिश करो।";
    loginButton.disabled = false;
    password.value = "";
    return;
  }

  try {
    localStorage.setItem("vyroLoggedIn", "yes");
    window.location.href = "home.html";
  } catch (error) {
    message.textContent = "ब्राउज़र में डेटा सेव नहीं हो पाया।";
    loginButton.disabled = false;
  }
}

window.addEventListener("online", async () => {
  if (!loginScreen.classList.contains("hidden")) {
    const connected = await checkInternet();

    if (connected) {
      pageReady = true;
      loginButton.disabled = false;
    }
  }
});

window.addEventListener("offline", () => {
  internetOK = false;
  loginButton.disabled = true;

  if (!loginScreen.classList.contains("hidden")) {
    message.textContent = "इंटरनेट बंद है। इंटरनेट चालू करो।";
  }
});

startApp();
</script>

</body>
</html>
