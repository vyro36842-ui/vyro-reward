<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyro Reward - Welcome</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #060812;
            --primary-gold: #FFD700;
            --secondary-gold: #FFA500;
            --accent-purple: #8A2BE2;
            --neon-blue: #00F3FF;
            --neon-red: #FF3366;
            --card-bg: rgba(18, 22, 41, 0.85);
            --border-glow: rgba(255, 215, 0, 0.25);
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Particle Canvas Background */
        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Glow Orbs */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 1;
            pointer-events: none;
            opacity: 0.5;
            animation: pulseGlow 8s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, var(--accent-purple), transparent);
            top: -10%;
            left: -10%;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.3), transparent);
            bottom: -10%;
            right: -10%;
            animation-delay: -4s;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
            100% { transform: scale(1.3) translate(30px, -30px); opacity: 0.7; }
        }

        /* Container */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Stage Handling */
        .stage {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .stage-hidden {
            opacity: 0;
            transform: scale(0.92) translateY(20px);
            pointer-events: none;
            position: absolute;
        }

        .stage-active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: all;
            position: relative;
        }

        /* ================= STAGE 1: SPLASH ================= */
        .logo-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 35px;
            perspective: 1000px;
        }

        .ring-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--primary-gold);
            border-right-color: var(--neon-blue);
            animation: spinContinuous 3s linear infinite;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .ring-inner {
            position: absolute;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            border: 2px dashed rgba(138, 43, 226, 0.6);
            animation: spinReverse 6s linear infinite;
        }

        /* 360 Rotating 'V' Logo */
        .logo-3d-v {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 72px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFF 0%, var(--primary-gold) 50%, var(--secondary-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 18px rgba(255, 215, 0, 0.6));
            transform-style: preserve-3d;
            animation: rotateV3D 4s linear infinite;
        }

        @keyframes rotateV3D {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        @keyframes spinContinuous {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spinReverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        .brand-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #FFFFFF 0%, #CBD5E1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .brand-tagline {
            font-size: 13px;
            color: var(--primary-gold);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 45px;
        }

        .progress-box {
            width: 100%;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-purple), var(--primary-gold), var(--neon-blue));
            border-radius: 20px;
            box-shadow: 0 0 12px var(--primary-gold);
            transition: width 0.1s linear;
        }

        .progress-text-group {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .counter-num {
            color: var(--primary-gold);
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
        }

        /* ================= STAGE 2: LOGIN CARD ================= */
        .glass-card {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 28px;
            padding: 32px 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .card-icon {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            color: var(--primary-gold);
            margin-bottom: 20px;
        }

        .welcome-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #FFF;
        }

        .welcome-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .age-checkbox-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            cursor: pointer;
        }

        .custom-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--text-muted);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .custom-checkbox i {
            color: #060812;
            font-size: 12px;
            display: none;
        }

        #ageCheck {
            display: none;
        }

        #ageCheck:checked + .custom-checkbox {
            background: var(--primary-gold);
            border-color: var(--primary-gold);
        }

        #ageCheck:checked + .custom-checkbox i {
            display: block;
        }

        .checkbox-label {
            font-size: 13px;
            color: #E2E8F0;
            text-align: left;
        }

        .checkbox-label span {
            color: var(--primary-gold);
            font-weight: 700;
        }

        .btn-google {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            background: #FFFFFF;
            color: #1E293B;
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            opacity: 0.4;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .btn-google.active {
            opacity: 1;
            pointer-events: all;
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.3);
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        .security-tag {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 20px;
        }

        .security-tag i {
            color: #10B981;
        }

        /* ================= OFFLINE ERROR OVERLAY ================= */
        .offline-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(6, 8, 18, 0.96);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .offline-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .offline-card {
            width: 100%;
            max-width: 380px;
            background: rgba(22, 16, 28, 0.9);
            border: 1px solid rgba(255, 51, 102, 0.3);
            border-radius: 28px;
            padding: 36px 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(255, 51, 102, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .offline-icon-box {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: rgba(255, 51, 102, 0.12);
            border: 1px solid rgba(255, 51, 102, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            color: var(--neon-red);
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.3);
        }

        .offline-title {
            font-size: 22px;
            font-weight: 800;
            color: #FFF;
            margin-bottom: 10px;
        }

        .offline-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn-retry {
            width: 10% auto;
            width: 100%;
            padding: 15px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, var(--neon-red), #D91B5C);
            color: #FFF;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 51, 102, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <!-- Particle Canvas -->
    <canvas id="particleCanvas"></canvas>

    <!-- Glow Orbs -->
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="app-container">

        <!-- STAGE 1: SPLASH -->
        <div id="stageSplash" class="stage stage-active">
            <div class="logo-wrapper">
                <div class="ring-outer"></div>
                <div class="ring-inner"></div>
                <div class="logo-3d-v">V</div>
            </div>

            <h1 class="brand-title">VYRO REWARD</h1>
            <p class="brand-tagline">Play • Earn • Redeem</p>

            <div class="progress-box">
                <div class="progress-bar-bg">
                    <div id="progressFill" class="progress-bar-fill"></div>
                </div>
                <div class="progress-text-group">
                    <span>Loading resources...</span>
                    <span class="counter-num"><span id="progressNum">0</span>%</span>
                </div>
            </div>
        </div>

        <!-- STAGE 2: AGE & AUTH -->
        <div id="stageAuth" class="stage stage-hidden">
            <div class="glass-card">
                <div class="card-icon">
                    <i class="fa-solid fa-gift"></i>
                </div>
                
                <h2 class="welcome-title">Welcome to Vyro</h2>
                <p class="welcome-subtitle">Join thousands of users earning daily rewards. Sign in to continue.</p>

                <!-- 18+ Checkbox -->
                <label class="age-checkbox-container" for="ageCheck">
                    <input type="checkbox" id="ageCheck" onchange="toggleGoogleBtn()">
                    <div class="custom-checkbox">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <div class="checkbox-label">
                        I confirm that I am <span>18 years</span> or older and accept terms.
                    </div>
                </label>

                <!-- Google Login Button -->
                <button id="btnGoogle" class="btn-google" onclick="handleGoogleLogin()">
                    <svg class="google-icon" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.24v3.15C3.26 21.37 7.36 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.24C.45 8.15 0 9.99 0 12s.45 3.85 1.24 5.42l4.04-3.15z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.36 0 3.26 2.63 1.24 6.58l4.04 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                    </svg>
                    <span id="btnText">Sign in with Google</span>
                </button>

                <div class="security-tag">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>Protected with Firebase Security</span>
                </div>
            </div>
        </div>

    </div>

    <!-- OFFLINE ERROR OVERLAY -->
    <div id="offlineOverlay" class="offline-overlay">
        <div class="offline-card">
            <div class="offline-icon-box">
                <i class="fa-solid fa-wifi"></i>
            </div>
            <h3 class="offline-title">Connection Lost</h3>
            <p class="offline-desc">Internet connection is required to access Vyro Reward. Please check your data or Wi-Fi network.</p>
            <button class="btn-retry" onclick="checkNetworkAndRetry()">
                <i class="fa-solid fa-rotate-right"></i>
                <span>Retry Connection</span>
            </button>
        </div>
    </div>

    <!-- PURE INDEPENDENT 0-100% LOADER SCRIPT -->
    <script>
        var progressPercent = 0;
        var progressFill = document.getElementById('progressFill');
        var progressNum = document.getElementById('progressNum');
        var stageSplash = document.getElementById('stageSplash');
        var stageAuth = document.getElementById('stageAuth');
        var offlineOverlay = document.getElementById('offlineOverlay');

        // Pure Local Timer Loader (Will NEVER block or stick at 0)
        function startPureLoader() {
            if (!navigator.onLine) {
                showOfflineOverlay();
                return;
            }

            if (progressPercent < 100) {
                progressPercent += Math.floor(Math.random() * 4) + 3;
                if (progressPercent > 100) progressPercent = 100;

                if (progressFill) progressFill.style.width = progressPercent + '%';
                if (progressNum) progressNum.innerText = progressPercent;

                setTimeout(startPureLoader, 25);
            } else {
                // 100% Reached! Now evaluate login state from window variables set by Firebase module
                evaluateDestination();
            }
        }

        function evaluateDestination() {
            if (!navigator.onLine) {
                showOfflineOverlay();
                return;
            }

            // If Firebase hasn't responded yet, wait 100ms
            if (window.firebaseUserSession === undefined) {
                setTimeout(evaluateDestination, 100);
                return;
            }

            if (window.firebaseUserSession) {
                // Already Logged In -> Go to Dashboard
                window.location.href = "dashboard.html";
            } else {
                // Not Logged In -> Show Login Card
                if (stageSplash) {
                    stageSplash.classList.remove('stage-active');
                    stageSplash.classList.add('stage-hidden');
                }
                setTimeout(function() {
                    if (stageAuth) {
                        stageAuth.classList.remove('stage-hidden');
                        stageAuth.classList.add('stage-active');
                    }
                }
