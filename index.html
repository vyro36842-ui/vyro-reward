<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyro Reward - Welcome</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs (CDN Version - No Module Blocking) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <style>
        :root {
            --bg-color: #060812;
            --primary-gold: #FFD700;
            --secondary-gold: #FFA500;
            --accent-purple: #8A2BE2;
            --neon-blue: #00F3FF;
            --neon-red: #FF3366;
            --card-bg: rgba(18, 22, 41, 0.85);
            --border-glow: rgba(255, 215, 0, 0.25);
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .stage {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .stage-hidden {
            opacity: 0;
            transform: scale(0.92) translateY(20px);
            pointer-events: none;
            position: absolute;
        }

        .stage-active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: all;
            position: relative;
        }

        /* Splash Styles */
        .logo-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 35px;
        }

        .ring-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--primary-gold);
            border-right-color: var(--neon-blue);
            animation: spinContinuous 3s linear infinite;
        }

        .logo-3d-v {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 72px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFF 0%, var(--primary-gold) 50%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 18px rgba(255, 215, 0, 0.6));
        }

        @keyframes spinContinuous {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .brand-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #FFFFFF;
            margin-bottom: 6px;
        }

        .brand-tagline {
            font-size: 13px;
            color: var(--primary-gold);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 45px;
        }

        .progress-box {
            width: 100%;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-purple), var(--primary-gold), var(--neon-blue));
            border-radius: 20px;
        }

        .progress-text-group {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
        }

        .counter-num {
            color: var(--primary-gold);
            font-weight: 700;
        }

        /* Login Card */
        .glass-card {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 28px;
            padding: 32px 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .card-icon {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            color: var(--primary-gold);
            margin-bottom: 20px;
        }

        .welcome-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #FFF;
        }

        .welcome-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        .age-checkbox-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            cursor: pointer;
        }

        .custom-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--text-muted);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .custom-checkbox i {
            color: #060812;
            font-size: 12px;
            display: none;
        }

        #ageCheck {
            display: none;
        }

        #ageCheck:checked + .custom-checkbox {
            background: var(--primary-gold);
            border-color: var(--primary-gold);
        }

        #ageCheck:checked + .custom-checkbox i {
            display: block;
        }

        .checkbox-label {
            font-size: 13px;
            color: #E2E8F0;
            text-align: left;
        }

        .checkbox-label span {
            color: var(--primary-gold);
            font-weight: 700;
        }

        .btn-google {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            background: #FFFFFF;
            color: #1E293B;
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            opacity: 0.4;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .btn-google.active {
            opacity: 1;
            pointer-events: all;
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.3);
        }

        /* Offline Overlay */
        .offline-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(6, 8, 18, 0.96);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .offline-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .offline-card {
            width: 100%;
            max-width: 380px;
            background: rgba(22, 16, 28, 0.9);
            border: 1px solid rgba(255, 51, 102, 0.3);
            border-radius: 28px;
            padding: 36px 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .offline-icon-box {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: rgba(255, 51, 102, 0.12);
            color: var(--neon-red);
            font-size: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-retry {
            width: 100%;
            padding: 15px;
            border-radius: 16px;
            border: none;
            background: var(--neon-red);
            color: #FFF;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <div class="app-container">
        <!-- SPLASH STAGE -->
        <div id="stageSplash" class="stage stage-active">
            <div class="logo-wrapper">
                <div class="ring-outer"></div>
                <div class="logo-3d-v">V</div>
            </div>
            <h1 class="brand-title">VYRO REWARD</h1>
            <p class="brand-tagline">Play • Earn • Redeem</p>

            <div class="progress-box">
                <div class="progress-bar-bg">
                    <div id="progressFill" class="progress-bar-fill"></div>
                </div>
                <div class="progress-text-group">
                    <span>Loading...</span>
                    <span class="counter-num"><span id="progressNum">0</span>%</span>
                </div>
            </div>
        </div>

        <!-- AUTH STAGE -->
        <div id="stageAuth" class="stage stage-hidden">
            <div class="glass-card">
                <div class="card-icon"><i class="fa-solid fa-gift"></i></div>
                <h2 class="welcome-title">Welcome to Vyro</h2>
                <p class="welcome-subtitle">Sign in to start earning rewards.</p>

                <label class="age-checkbox-container" for="ageCheck">
                    <input type="checkbox" id="ageCheck" onchange="toggleGoogleBtn()">
                    <div class="custom-checkbox"><i class="fa-solid fa-check"></i></div>
                    <div class="checkbox-label">I am <span>18 years</span> or older.</div>
                </label>

                <button id="btnGoogle" class="btn-google" onclick="handleGoogleLogin()">
                    <i class="fa-brands fa-google" style="color: #EA4335;"></i>
                    <span>Sign in with Google</span>
                </button>
            </div>
        </div>
    </div>

    <!-- OFFLINE OVERLAY -->
    <div id="offlineOverlay" class="offline-overlay">
        <div class="offline-card">
            <div class="offline-icon-box"><i class="fa-solid fa-wifi"></i></div>
            <h3 style="color: #FFF; margin-bottom: 10px;">Connection Lost</h3>
            <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 25px;">Please check your internet connection.</p>
            <button class="btn-retry" onclick="location.reload()">Retry</button>
        </div>
    </div>

    <!-- Firebase Config File -->
    <script src="firebase.js"></script>

    <!-- App Script -->
    <script>
        var progress = 0;
        var pFill = document.getElementById('progressFill');
        var pNum = document.getElementById('progressNum');
        var splashStage = document.getElementById('stageSplash');
        var authStage = document.getElementById('stageAuth');
        var offlineBox = document.getElementById('offlineOverlay');

        // 1. Check Offline first
        if (!navigator.onLine) {
            offlineBox.classList.add('active');
        }

        // 2. Guaranteed 0-100% Loader
        function runLoader() {
            if (!navigator.onLine) {
                offlineBox.classList.add('active');
                return;
            }

            if (progress < 100) {
                progress += Math.floor(Math.random() * 5) + 3;
                if (progress > 100) progress = 100;

                if (pFill) pFill.style.width = progress + '%';
                if (pNum) pNum.innerText = progress;

                setTimeout(runLoader, 25);
            } else {
                // 100% complete! Check Firebase Persistent Auth
                checkAuthSession();
            }
        }

        function checkAuthSession() {
            auth.onAuthStateChanged(function(user) {
                if (user) {
                    // Already logged in -> Direct Dashboard
                    window.location.href = "dashboard.html";
                } else {
                    // Show Login card
                    splashStage.classList.remove('stage-active');
                    splashStage.classList.add('stage-hidden');
                    setTimeout(function() {
                        authStage.classList.remove('stage-hidden');
                        authStage.classList.add('stage-active');
                    }, 300);
                }
            });
        }

        // Google Login Function
        function handleGoogleLogin() {
            if (!navigator.onLine) {
                offlineBox.classList.add('active');
                return;
            }

            var provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then(function(result) {
                    window.location.href = "dashboard.html";
                })
                .catch(function(error) {
                    alert("Login failed: " + error.message);
                });
        }

        function toggleGoogleBtn() {
            var isChecked = document.getElementById('ageCheck').checked;
            var btnGoogle = document.getElementById('btnGoogle');
            if (isChecked) {
                btnGoogle.classList.add('active');
            } else {
                btnGoogle.classList.remove('active');
            }
        }

        // Start Loader on Load
        window.onload = function() {
            if (navigator.onLine) {
                runLoader();
            }
        };

        window.addEventListener('online', function() {
            offlineBox.classList.remove('active');
            if (progress >= 100) checkAuthSession();
        });

        window.addEventListener('offline', function() {
            offlineBox.classList.add('active');
        });
    </script>
</body>
</html>
