
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vyro Reward</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #100909;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.screen {
  width: 100%;
  max-width: 420px;
  min-height: 100vh;
  padding: 25px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.logo {
  width: 125px;
  height: 125px;
  border: 4px solid #ffca28;
  border-radius: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffca28;
  font-size: 48px;
  font-weight: bold;
  background: linear-gradient(145deg, #5e0808, #190606);
  box-shadow: 0 0 30px #a91d1d55;
}

h1 {
  margin: 22px 0 8px;
  font-size: 30px;
}

.gold {
  color: #ffca28;
}

p {
  color: #c9bdbd;
}

.progress {
  width: 100%;
  height: 10px;
  margin-top: 30px;
  background: #392020;
  border-radius: 20px;
  overflow: hidden;
}

.bar {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #ed2727, #ffca28);
  border-radius: 20px;
}

#percent {
  margin-top: 12px;
  color: #ffca28;
}

input {
  width: 100%;
  padding: 16px;
  margin-top: 22px;
  border: 1px solid #9b2929;
  border-radius: 12px;
  background: #211313;
  color: white;
  font-size: 20px;
  text-align: center;
  outline: none;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 18px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(90deg, #e32222, #ffbd22);
  color: #160808;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

.message {
  min-height: 24px;
  color: #ffca28;
  font-size: 14px;
  margin-top: 16px;
}

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<!-- LOADING SCREEN -->
<section class="screen" id="loadingScreen">
  <div class="logo">V</div>
  <h1>VYRO <span class="gold">REWARD</span></h1>
  <p>Welcome to Vyro Reward</p>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>

  <div id="percent">0%</div>
  <p id="loadingMessage">Loading...</p>
</section>

<!-- LOGIN SCREEN -->
<section class="screen hidden" id="loginScreen">
  <div class="logo">V</div>
  <h1>VYRO <span class="gold">REWARD</span></h1>
  <p>Enter your password to continue</p>

  <input
    id="password"
    type="password"
    inputmode="numeric"
    maxlength="6"
    placeholder="Enter Password"
    autocomplete="current-password"
  >

  <button id="loginButton" onclick="login()" disabled>
    Login
  </button>

  <div class="message" id="message">
    Checking internet connection...
  </div>
</section>

<!-- NEXT SCREEN -->
<section class="screen hidden" id="homeScreen">
  <div class="logo">V</div>
  <h1>Welcome to <span class="gold">Vyro Reward</span></h1>
  <p>Login successful!</p>
</section>

<script>
const loadingScreen = document.getElementById("loadingScreen");
const loginScreen = document.getElementById("loginScreen");
const homeScreen = document.getElementById("homeScreen");
const bar = document.getElementById("bar");
const percent = document.getElementById("percent");
const loadingMessage = document.getElementById("loadingMessage");
const password = document.getElementById("password");
const loginButton = document.getElementById("loginButton");
const message = document.getElementById("message");

let internetOK = false;
let checking = false;
let pageReady = false;

function showScreen(screen) {
  loadingScreen.classList.add("hidden");
  loginScreen.classList.add("hidden");
  homeScreen.classList.add("hidden");
  screen.classList.remove("hidden");
}

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// Check whether the internet can actually be reached
async function checkInternet() {
  if (checking) return internetOK;
  checking = true;
  internetOK = false;
  loginButton.disabled = true;

  if (!navigator.onLine) {
    message.textContent = "Internet band hai. Internet on karo.";
    checking = false;
    return false;
  }

  message.textContent = "Checking internet connection...";

  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 5000);

    await fetch("https://www.google.com/generate_204", {
      mode: "no-cors",
      cache: "no-store",
      signal: controller.signal
    });

    clearTimeout(timeout);
    internetOK = true;
    message.textContent = "Internet connected.";
  } catch (error) {
    internetOK = false;
    message.textContent = "Internet nahi chal raha. Dobara check karo.";
  }

  checking = false;
  loginButton.disabled = !internetOK;
  return internetOK;
}

// Loading from 0 to 100
async function startApp() {
  for (let i = 0; i <= 100; i++) {
    bar.style.width = i + "%";
    percent.textContent = i + "%";
    await wait(25);
  }

  loadingMessage.textContent = "Checking internet...";
  const connected = await checkInternet();

  if (!connected) {
    showScreen(loginScreen);
    return;
  }

  pageReady = true;

  if (localStorage.getItem("vyroLoggedIn") === "yes") {
    showScreen(homeScreen);
  } else {
    showScreen(loginScreen);
  }
}

async function login() {
  if (!pageReady || checking) return;

  loginButton.disabled = true;
  const connected = await checkInternet();

  if (!connected) {
    loginButton.disabled = true;
    return;
  }

  if (password.value !== "123456") {
    message.textContent = "Wrong password. Try again.";
    loginButton.disabled = !internetOK;
    return;
  }

  localStorage.setItem("vyroLoggedIn", "yes");
  password.value = "";
  showScreen(homeScreen);
}

window.addEventListener("online", () => {
  if (!loginScreen.classList.contains("hidden")) {
    checkInternet();
  }
});

window.addEventListener("offline", () => {
  internetOK = false;
  loginButton.disabled = true;

  if (!loginScreen.classList.contains("hidden")) {
    message.textContent = "Internet band hai. Internet on karo.";
  }
});

startApp();
</script>

</body>
</html>
