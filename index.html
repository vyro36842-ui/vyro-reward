<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyro Reward</title>
    <style>
        :root {
            --bg-dark: #121212;
            --surface-dark: #1e1e1e;
            --primary-red: #e50914;
            --gold-yellow: #ffd700;
            --text-light: #ffffff;
            --text-gray: #b3b3b3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Loading Screen Style */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: opacity 0.5s ease;
        }

        .logo-text {
            color: var(--gold-yellow);
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .loader-bar-container {
            width: 250px;
            height: 6px;
            background-color: var(--surface-dark);
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .loader-bar {
            width: 0%;
            height: 100%;
            background-color: var(--primary-red);
            transition: width 0.1s linear;
        }

        .loading-percentage {
            margin-top: 10px;
            color: var(--text-gray);
            font-size: 14px;
        }

        /* Main App Container (Hidden initially) */
        #app-container {
            display: none;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background-color: var(--surface-dark);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Header */
        .app-header {
            padding: 16px;
            background-color: #181818;
            border-bottom: 1px solid #282828;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-header h1 {
            color: var(--gold-yellow);
            font-size: 20px;
        }

        /* Content Area */
        .app-content {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }

        /* Bottom Navigation (4 Tabs only) */
        .bottom-nav {
            height: 60px;
            background-color: #181818;
            border-top: 1px solid #282828;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav-item {
            color: var(--text-gray);
            text-decoration: none;
            font-size: 12px;
            text-align: center;
            background: none;
            border: none;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--gold-yellow);
        }
    </style>
</head>
<body>

    <!-- Loading Screen 0 to 100% -->
    <div id="loading-screen">
        <div class="logo-text">VYRO REWARD</div>
        <div class="loader-bar-container">
            <div class="loader-bar" id="loader-bar"></div>
        </div>
        <div class="loading-percentage" id="loading-percentage">0%</div>
    </div>

    <!-- Main App Screen (Loads after 100%) -->
    <div id="app-container" style="display: none;">
        <header class="app-header">
            <h1>Vyro Reward</h1>
            <span style="font-size: 12px; color: var(--gold-yellow);">Test Mode</span>
        </header>

        <div class="app-content">
            <h2 style="color: var(--gold-yellow); margin-bottom: 10px;">स्वागत है!</h2>
            <p style="color: var(--text-gray); font-size: 14px;">यह Vyro Reward का प्रीमियम होम पेज है। पासवर्ड (123456) और अन्य सेटिंग्स अगले चरणों में जोड़ी जाएंगी।</p>
        </div>

        <nav class="bottom-nav">
            <button class="nav-item active">Home</button>
            <button class="nav-item">Wallet</button>
            <button class="nav-item">Refer</button>
            <button class="nav-item">Setting</button>
        </nav>
    </div>

    <script>
        // 0 to 100% Loading Simulator
        let width = 0;
        const bar = document.getElementById('loader-bar');
        const percentageText = document.getElementById('loading-percentage');
        const loadingScreen = document.getElementById('loading-screen');
        const appContainer = document.getElementById('app-container');

        const loadingInterval = setInterval(() => {
            if (width >= 100) {
                clearInterval(loadingInterval);
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    appContainer.style.display = 'flex';
                }, 500);
            } else {
                width += 2; // Speed control
                bar.style.width = width + '%';
                percentageText.innerText = width + '%';
            }
        }, 30); // 30ms interval for smooth loading
    </script>
</body>
  </html>
