    <!-- Interactive Script -->
    <script>
        // Interactive Ambient Canvas Particles
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = [];
        const particleCount = 45;

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
                this.alpha = Math.random() * 0.6 + 0.2;
                this.color = Math.random() > 0.5 ? '#D4AF37' : '#A855F7';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // Stage 1: Splash Progress Logic
        let progress = 0;

        function runSplashSequence() {
            const splashScreen = document.getElementById('splashScreen');
            const loginScreen = document.getElementById('loginScreen');
            const progressBar = document.getElementById('progressBar');
            const percentageText = document.getElementById('percentage');
            const revealText = document.getElementById('revealText');

            setTimeout(() => {
                revealText.classList.remove('opacity-0');
                revealText.classList.add('opacity-100');
            }, 400);

            const progressInterval = setInterval(() => {
                const step = Math.floor(Math.random() * 4) + 2;
                progress += step;

                if (progress >= 100) {
                    progress = 100;
                    clearInterval(progressInterval);

                    // Smooth transition to Stage 2 (Login Screen)
                    setTimeout(() => {
                        splashScreen.classList.add('opacity-0');
                        
                        setTimeout(() => {
                            splashScreen.classList.add('hidden');
                            loginScreen.classList.remove('hidden');
                            
                            setTimeout(() => {
                                loginScreen.classList.remove('opacity-0', 'translate-y-10');
                            }, 50);
                        }, 600);
                    }, 300);
                }

                progressBar.style.width = progress + '%';
                percentageText.innerText = progress + '%';
            }, 60);
        }

        // Toggle Google Login Button Active / Disabled State
        function toggleGoogleLogin(checkbox) {
            const googleBtn = document.getElementById('googleBtn');
            
            if (checkbox.checked) {
                googleBtn.removeAttribute('disabled');
                googleBtn.classList.remove('btn-google-disabled');
                googleBtn.classList.add('btn-google-active');
            } else {
                googleBtn.setAttribute('disabled', 'true');
                googleBtn.classList.remove('btn-google-active');
                googleBtn.classList.add('btn-google-disabled');
            }
        }

        // Action when 'Sign in with Google' is clicked
        function handleGoogleSignIn() {
            const googleBtnText = document.getElementById('googleBtnText');
            const googleBtn = document.getElementById('googleBtn');

            // Show temporary loading state
            googleBtnText.innerText = "Connecting Google Auth...";
            googleBtn.style.opacity = "0.8";

            setTimeout(() => {
                // Here Firebase Google Login logic will be triggered
                alert("🔑 Connecting to Firebase Google Login flow...");
                googleBtnText.innerText = "Sign in with Google";
                googleBtn.style.opacity = "1";
            }, 1000);
        }

        // Start on Page Load
        window.onload = function() {
            runSplashSequence();
        };
    </script>
</body>
</html>
